    </g>
    <circle cx="256" cy="256" r="256" fill="url(#haloA)"></circle>
    <rect width="512" height="200" fill="url(#topGloss)"></rect>
    <circle cx="256" cy="256" r="200" fill="none" stroke="#B5F23D" stroke-width="1" stroke-dasharray="2,6" opacity="0.5"></circle>
    <circle cx="256" cy="256" r="172" fill="none" stroke="#cbf677" stroke-width="1" opacity="0.35"></circle>
    
    <g filter="url(#neon)" stroke="#B5F23D" stroke-width="6" fill="none" stroke-linejoin="round">
      <line x1="216" y1="140" x2="216" y2="240"></line>
      <line x1="296" y1="140" x2="296" y2="240"></line>
      <line x1="200" y1="140" x2="312" y2="140" stroke-width="7"></line>
      <path d="M 216 240 L 156 348 Q 144 372 168 372 H 344 Q 368 372 356 348 L 296 240"></path>
    </g>
    <path d="M 216 240 L 156 348 Q 144 372 168 372 H 344 Q 368 372 356 348 L 296 240 Z" fill="#B5F23D" opacity="0.10"></path>
    <g fill="#cbf677" filter="url(#softGlow)">
      <circle cx="240" cy="332" r="8">
        
      </circle>
      <circle cx="270" cy="340" r="5" opacity="0.7">
        
      </circle>
      <circle cx="296" cy="346" r="6" opacity="0.85">
        
      </circle>
    </g>
    <ellipse cx="256" cy="470" rx="240" ry="14" fill="#B5F23D" opacity="0.08" filter="url(#softGlow)"></ellipse>
  </g>
  <rect x="0.5" y="0.5" width="511" height="511" rx="95.5" ry="95.5" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"></rect>
