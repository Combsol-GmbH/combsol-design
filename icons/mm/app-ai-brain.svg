    </g>
    <circle cx="256" cy="256" r="256" fill="url(#haloA)"></circle>
    <rect width="512" height="200" fill="url(#topGloss)"></rect>
    <circle cx="256" cy="256" r="200" fill="none" stroke="#FF5BB8" stroke-width="1" stroke-dasharray="2,6" opacity="0.5"></circle>
    <circle cx="256" cy="256" r="172" fill="none" stroke="#ff8ccd" stroke-width="1" opacity="0.35"></circle>
    
    <g filter="url(#neon)" stroke="#FF5BB8" stroke-width="6" fill="none">
      <path d="M 220 144 Q 168 144 160 196 Q 132 220 144 264 Q 132 308 168 328 Q 184 372 232 372 Q 256 388 256 372 V 152 Q 256 144 232 144 Z"></path>
      <path d="M 292 144 Q 344 144 352 196 Q 380 220 368 264 Q 380 308 344 328 Q 328 372 280 372 Q 256 388 256 372 V 152 Q 256 144 280 144 Z"></path>
    </g>
    <g stroke="#FF5BB8" stroke-width="3" opacity="0.55" filter="url(#softGlow)">
      <line x1="200" y1="200" x2="200" y2="320"></line>
      <line x1="312" y1="200" x2="312" y2="320"></line>
      <line x1="196" y1="232" x2="232" y2="252"></line>
      <line x1="232" y1="276" x2="200" y2="296"></line>
      <line x1="316" y1="232" x2="280" y2="252"></line>
      <line x1="280" y1="276" x2="316" y2="296"></line>
    </g>
    <g fill="#ff8ccd" filter="url(#softGlow)">
      <circle cx="200" cy="200" r="6"></circle>
      <circle cx="200" cy="320" r="6"></circle>
      <circle cx="312" cy="200" r="6"></circle>
      <circle cx="312" cy="320" r="6"></circle>
      <circle cx="232" cy="252" r="7"></circle>
      <circle cx="232" cy="276" r="7"></circle>
      <circle cx="280" cy="252" r="7"></circle>
      <circle cx="280" cy="276" r="7"></circle>
    </g>
    <ellipse cx="256" cy="470" rx="240" ry="14" fill="#FF5BB8" opacity="0.08" filter="url(#softGlow)"></ellipse>
  </g>
  <rect x="0.5" y="0.5" width="511" height="511" rx="95.5" ry="95.5" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"></rect>
</svg>