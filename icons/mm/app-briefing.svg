          <circle r="14" fill="#FFD24D"></circle>
          <line x1="20" y1="0" x2="28" y2="0" stroke="#FFD24D" stroke-width="3" stroke-linecap="round"></line><line x1="14.142135623730951" y1="14.14213562373095" x2="19.79898987322333" y2="19.798989873223327" stroke="#FFD24D" stroke-width="3" stroke-linecap="round"></line><line x1="1.2246467991473533e-15" y1="20" x2="1.7145055188062944e-15" y2="28" stroke="#FFD24D" stroke-width="3" stroke-linecap="round"></line><line x1="-14.14213562373095" y1="14.142135623730951" x2="-19.798989873223327" y2="19.79898987322333" stroke="#FFD24D" stroke-width="3" stroke-linecap="round"></line><line x1="-20" y1="2.4492935982947065e-15" x2="-28" y2="3.429011037612589e-15" stroke="#FFD24D" stroke-width="3" stroke-linecap="round"></line><line x1="-14.142135623730955" y1="-14.14213562373095" x2="-19.798989873223334" y2="-19.798989873223327" stroke="#FFD24D" stroke-width="3" stroke-linecap="round"></line><line x1="-3.673940397442059e-15" y1="-20" x2="-5.143516556418883e-15" y2="-28" stroke="#FFD24D" stroke-width="3" stroke-linecap="round"></line><line x1="14.142135623730947" y1="-14.142135623730955" x2="19.798989873223327" y2="-19.798989873223334" stroke="#FFD24D" stroke-width="3" stroke-linecap="round"></line>
        </g>
        
        <text x="256" y="335" font-family="Inter, sans-serif" font-size="210" font-weight="700" text-anchor="middle" fill="#5BE6FF" stroke="#5BD6A7" stroke-width="5" filter="url(#neon)" paint-order="stroke fill">B</text>
        
        <g transform="translate(130,360)" filter="url(#softGlow)">
          <rect x="0" y="0" width="36" height="36" rx="4" fill="none" stroke="#4DBDF0" stroke-width="3"></rect>
          <line x1="0" y1="11" x2="36" y2="11" stroke="#4DBDF0" stroke-width="3"></line>
          <path d="M 12 22 L 16 26 L 26 16" fill="none" stroke="#4DBDF0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
        </g>
        
        <g transform="translate(346,360)" filter="url(#softGlow)">
          <rect x="0" y="0" width="36" height="32" rx="3" fill="none" stroke="#5BE6FF" stroke-width="3"></rect>
          <line x1="6" y1="10" x2="30" y2="10" stroke="#5BE6FF" stroke-width="3" stroke-linecap="round"></line>
          <line x1="6" y1="17" x2="30" y2="17" stroke="#5BE6FF" stroke-width="3" stroke-linecap="round"></line>
          <line x1="6" y1="24" x2="22" y2="24" stroke="#5BE6FF" stroke-width="3" stroke-linecap="round"></line>
        </g>

    
    <ellipse cx="256" cy="470" rx="240" ry="14" fill="#5BD6A7" opacity="0.08" filter="url(#softGlow)"></ellipse>
  </g>

  
  <rect x="0.5" y="0.5" width="511" height="511" rx="95.5" ry="95.5" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"></rect>
</svg>